<p-dialog
  [header]="warehouse() ? 'Editar armazém' : 'Novo armazém'"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col gap-2">
      <label for="warehouse-name" class="font-medium">Nome</label>
      <input
        pInputText
        id="warehouse-name"
        formControlName="name"
        autocomplete="off"
        [invalid]="form.controls.name.invalid && form.controls.name.touched"
      />
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <p-message severity="error" size="small" variant="simple">Informe o nome.</p-message>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="warehouse-address" class="font-medium">Endereço</label>
      <input pInputText id="warehouse-address" formControlName="address" autocomplete="off" />
    </div>

    <div class="flex flex-col gap-2">
      <label for="warehouse-capacity" class="font-medium">Capacidade (unidades)</label>
      <p-inputnumber
        inputId="warehouse-capacity"
        formControlName="capacity"
        [min]="0"
        [useGrouping]="true"
        [invalid]="form.controls.capacity.invalid && form.controls.capacity.touched"
      />
      <small class="text-muted-color">
        Total máximo de unidades, somando todos os produtos estocados.
      </small>
      @if (form.controls.capacity.touched && form.controls.capacity.hasError('required')) {
        <p-message severity="error" size="small" variant="simple">Informe a capacidade.</p-message>
      }
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="submit()" [loading]="saving()" />
  </ng-template>
</p-dialog>
