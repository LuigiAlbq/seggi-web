<p-dialog
  [header]="category() ? 'Editar categoria' : 'Nova categoria'"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '640px': '95vw' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex flex-col gap-2">
      <label for="category-name" class="font-medium">Nome</label>
      <input
        pInputText
        id="category-name"
        formControlName="name"
        maxlength="100"
        autocomplete="off"
        [invalid]="form.controls.name.invalid && form.controls.name.touched"
      />
      @if (form.controls.name.touched && form.controls.name.hasError('required')) {
        <p-message severity="error" size="small" variant="simple">Informe o nome.</p-message>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="category-description" class="font-medium">Descrição</label>
      <textarea
        pTextarea
        id="category-description"
        formControlName="description"
        rows="3"
        maxlength="255"
        [autoResize]="true"
      ></textarea>
      <small class="text-muted-color">Opcional, até 255 caracteres.</small>
    </div>
  </form>

  <ng-template #footer>
    <p-button label="Cancelar" severity="secondary" [text]="true" (onClick)="visible.set(false)" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="submit()" [loading]="saving()" />
  </ng-template>
</p-dialog>
